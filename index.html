    function uniqueSorted(key){return [...new Set(maintenanceData.map((d)=>d[key]))].sort((a,b)=>String(a).localeCompare(String(b),'ko'));}
    function fillSelect(select,values,allLabel){select.innerHTML='<option value="all">'+allLabel+'</option>'+values.map((v)=>'<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join('');}
    function sum(rows,key){return rows.reduce((acc,d)=>acc+Number(d[key]||0),0);} function average(rows,key){return rows.length?sum(rows,key)/rows.length:0;} function groupBy(rows,key){return rows.reduce((acc,d)=>{const v=d[key];(acc[v] ||= []).push(d);return acc;},{});} function sortedGroup(rows,key,metric,limit){return Object.entries(groupBy(rows,key)).map(([name,items])=>({name,count:items.length,cost:sum(items,'cost'),hours:sum(items,'hours'),value:metric==='cost'?sum(items,'cost'):items.length})).sort((a,b)=>b.value-a.value).slice(0,limit);} function filteredRows(){return maintenanceData.filter((d)=>(els.year.value==='all'||d.year===els.year.value)&&(els.location.value==='all'||d.location===els.location.value)&&(els.issue.value==='all'||d.issue===els.issue.value));}
    function pathLine(points){return points.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');} function barChart(target,rows,opts){if(!rows.length){target.innerHTML='<div class="empty">표시할 데이터가 없습니다.</div>';return;}const width=760,left=opts.left||132,right=24,rowH=opts.rowH||34,top=18,bottom=12,height=top+bottom+rows.length*rowH,max=Math.max(...rows.map((r)=>r.value),1),barW=width-left-right;const bars=rows.map((r,i)=>{const y=top+i*rowH+5,w=Math.max(2,(r.value/max)*barW),label=opts.format?opts.format(r.value,r):num.format(r.value);return '<text x="8" y="'+(y+15)+'" class="bar-label">'+escapeHtml(r.name)+'</text><rect x="'+left+'" y="'+y+'" width="'+w.toFixed(1)+'" height="18" rx="4" class="'+opts.className+'"></rect><text x="'+Math.min(left+w+8,width-100).toFixed(1)+'" y="'+(y+14)+'" class="bar-label">'+label+'</text>';}).join('');target.innerHTML='<svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+escapeHtml(opts.title)+'">'+bars+'</svg>';}
    function monthlyChart(rows){const groups=Object.entries(groupBy(rows,'month')).map(([month,items])=>({month,cost:sum(items,'cost'),count:items.length})).sort((a,b)=>a.month.localeCompare(b.month));if(!groups.length){els.monthlyChart.innerHTML='<div class="empty">표시할 데이터가 없습니다.</div>';return;}const width=980,height=310,left=54,right=28,top=24,bottom=52,plotW=width-left-right,plotH=height-top-bottom,maxCost=Math.max(...groups.map((g)=>g.cost),1),maxCount=Math.max(...groups.map((g)=>g.count),1),step=plotW/groups.length,barW=Math.max(6,step*.52),points=[];const bars=groups.map((g,i)=>{const x=left+i*step+(step-barW)/2,barH=(g.count/maxCount)*plotH,y=top+plotH-barH;points.push({x:left+i*step+step/2,y:top+plotH-(g.cost/maxCost)*plotH});const showLabel=groups.length<=16||i%3===0||i===groups.length-1;return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+barH.toFixed(1)+'" rx="3" class="count-bar"><title>'+g.month+' · '+g.count+'건 · '+krw.format(g.cost)+'</title></rect>'+(showLabel?'<text x="'+(left+i*step+step/2).toFixed(1)+'" y="'+(height-18)+'" text-anchor="middle" class="bar-label">'+g.month.slice(2)+'</text>':'');}).join('');const grid=[0,.25,.5,.75,1].map((t)=>'<line x1="'+left+'" x2="'+(width-right)+'" y1="'+(top+plotH*t).toFixed(1)+'" y2="'+(top+plotH*t).toFixed(1)+'" class="grid-line"></line>').join('');els.monthlyChart.innerHTML='<svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="월별 비용 및 건수 추이"><g>'+grid+bars+'</g><path d="'+pathLine(points)+'" class="cost-line"></path>'+points.map((p)=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" class="dot"></circle>').join('')+'<text x="'+left+'" y="16" class="line-label">최대 월 비용 '+krw.format(maxCost)+' · 최대 월 건수 '+maxCount+'건</text></svg>';}
    function renderTable(rows){const sorted=[...rows].sort((a,b)=>b.date.localeCompare(a.date));els.detailRows.innerHTML=sorted.map((d)=>'<tr><td>'+d.date+'</td><td>'+escapeHtml(d.equipment)+'</td><td>'+escapeHtml(d.location)+'</td><td>'+escapeHtml(d.issue)+'</td><td>'+escapeHtml(d.owner)+'</td><td class="num">'+d.hours.toFixed(1)+'시간</td><td class="num">'+krw.format(d.cost)+'</td><td><span class="tag '+(d.part==='Y'?'y':'n')+'">'+d.part+'</span></td></tr>').join('')||'<tr><td colspan="8" class="empty">표시할 데이터가 없습니다.</td></tr>';els.tableMeta.textContent=num.format(rows.length)+'건 표시';}
    function render(){const rows=filteredRows(),totalCost=sum(rows,'cost'),totalHours=sum(rows,'hours'),partRows=rows.filter((d)=>d.part==='Y').length,dates=rows.map((d)=>d.date).sort();els.totalCost.textContent=krw.format(totalCost);els.totalCount.textContent=num.format(rows.length)+'건';els.avgHours.textContent=average(rows,'hours').toFixed(2)+'시간';els.partRate.textContent=rows.length?((partRows/rows.length)*100).toFixed(1)+'%':'0.0%';els.avgCost.textContent='건당 평균 '+krw.format(rows.length?totalCost/rows.length:0);els.dateRange.textContent=rows.length?dates[0]+' - '+dates[dates.length-1]:'-';els.totalHours.textContent='총 수리시간 '+num.format(totalHours.toFixed(1))+'시간';els.partCount.textContent='부품교체 '+num.format(partRows)+'건';monthlyChart(rows);barChart(els.equipmentChart,sortedGroup(rows,'equipment','cost',8),{title:'비용 상위 장비',className:'bar-cost',format:(v,r)=>krw.format(v)+' · '+r.count+'건'});barChart(els.issueChart,sortedGroup(rows,'issue','count',8),{title:'이상유형 Top',className:'bar-issue',left:110,format:(v)=>num.format(v)+'건'});barChart(els.locationChart,sortedGroup(rows,'location','count',8),{title:'설치위치별 건수',className:'bar-count',left:88,format:(v)=>num.format(v)+'건'});renderTable(rows);}
    function init(){fillSelect(els.year,uniqueSorted('year'),'전체 연도');fillSelect(els.location,uniqueSorted('location'),'전체 위치');fillSelect(els.issue,uniqueSorted('issue'),'전체 이상유형');const dates=maintenanceData.map((d)=>d.date).sort();els.periodText.textContent=dates[0]+' - '+dates[dates.length-1];[els.year,els.location,els.issue].forEach((el)=>el.addEventListener('change',render));els.reset.addEventListener('click',()=>{els.year.value='all';els.location.value='all';els.issue.value='all';render();});render();} init();
  </script>
</body>
</html>
